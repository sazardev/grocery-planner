[package]
name = "grocery-planner"
version = "0.1.0"
description = "Grocery Planner - family self-hosted shopping planner"
authors = ["Omar Flores Salazar"]
license = "Apache-2.0"
repository = "https://github.com/sazardev/grocery-planner"
homepage = "https://github.com/sazardev/grocery-planner"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "grocery_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Servidor HTTP self-hosted (fase 2). Se compila con:
#   cargo run --features server --bin server
server = ["dep:axum", "dep:tower-http", "dep:tokio-stream", "dep:futures-util"]
[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
base64 = "0.22"
# Tokio es base (no solo server): el canal broadcast de cambios en tiempo real
# vive en `AppState`, compartido por IPC y HTTP.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "fs"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
futures-util = { version = "0.3", optional = true }
