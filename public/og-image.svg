<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Grocery Planner — la lista de compras de tu familia">
  <title>{{title}}</title>
  <desc>{{tagline1}} {{tagline2}}</desc>
  <rect width="1200" height="630" fill="#F8FAF9"/>
  <!-- Franja decorativa plana -->
  <rect x="0" y="0" width="1200" height="12" fill="#16A34A"/>
  <circle cx="1060" cy="560" r="220" fill="#DCFCE7"/>
  <circle cx="1130" cy="500" r="120" fill="#BBF7D0"/>
  <!-- Logo -->
  <g transform="translate(120,215) scale(1.9)">
    <rect width="100" height="100" rx="24" fill="#16A34A"/>
    <rect x="25" y="23" width="50" height="54" rx="10" fill="#FFFFFF"/>
    <rect x="34" y="38" width="26" height="6" rx="3" fill="#BBF7D0"/>
    <rect x="34" y="52" width="32" height="5" rx="2.5" fill="#DCFCE7"/>
    <rect x="34" y="64" width="22" height="5" rx="2.5" fill="#DCFCE7"/>
    <circle cx="66" cy="41" r="7" fill="#16A34A"/>
    <path d="M63 41l2 2 4-4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Texto -->
  <text x="360" y="300" font-family="'General Sans','Inter',system-ui,sans-serif" font-size="64" font-weight="700" fill="#1C2B22" letter-spacing="-1">{{title}}</text>
  <text x="360" y="368" font-family="'General Sans','Inter',system-ui,sans-serif" font-size="34" font-weight="500" fill="#6B7A70">{{tagline1}}</text>
  <text x="360" y="414" font-family="'General Sans','Inter',system-ui,sans-serif" font-size="34" font-weight="500" fill="#6B7A70">{{tagline2}}</text>
  <!-- Chip verde -->
  <rect x="360" y="452" width="230" height="48" rx="24" fill="#16A34A"/>
  <text x="475" y="484" font-family="'General Sans','Inter',system-ui,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">{{cta}}</text>
</svg>
