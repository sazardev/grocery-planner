name: Feature request
description: Sugiere una idea para el proyecto
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe la idea de forma clara y por qué le serviría a la familia.
  - type: textarea
    id: problem
    attributes:
      label: Problema que resuelve
      description: ¿Qué situación del día a día no cubre hoy la app?
      placeholder: "Cuando el mandado llega, no me entero hasta preguntar…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
      description: Cómo te imaginas que se ve y se siente.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Otras formas de resolverlo (incluida "no hacer nada").
  - type: checkboxes
    id: scope
    attributes:
      label: Alcance
      options:
        - label: Toca el modelo de datos / persistencia
        - label: Toca la UI (aplicaría DESIGN.md)
        - label: Solo backend
        - label: Solo documentación
